# https://taskfile.dev

version: '3'

tasks:
  clean:
    dir: '.'
    cmds:
      - sudo rm -rf ./build/
      - sudo rm -rf ./docker/

  lint:
    dir: './src'
    cmds:
      - golangci-lint run -c ../.golangci.yml

  lint-fmt:
    dir: './src'
    cmds:
      - golangci-lint fmt -c ../.golangci.yml

  swag:
    desc: Regenerate the Swagger API docs
    dir: './src'
    cmds:
      - go tool swag init

  swag-check:
    desc: Fails if the committed Swagger docs are out of date
    dir: './src'
    cmds:
      - task: swag
      - cmd: |
          if [ -n "$(git status --porcelain -- docs)" ]; then
            echo "Swagger docs are out of date. Run 'task swag' and commit the result:"
            git status --porcelain -- docs
            git --no-pager diff --stat -- docs
            exit 1
          fi
          echo "Swagger docs are up to date."

  build:
    dir: './src'
    cmds:
      - task: swag
      - go build -o ../build/antimony-server ./main.go
      - cp -r ../data/ ../build/
      - cp ../test/config.test.yml ../build/config.yml
      - cp ../test/config-c9s.test.yml ../build/config-c9s.yml
      - cp ../test/kinds.conf.yml ../build/kinds.conf.yml

  run:
    dir: './build'
    cmds:
      - task: build
      - sudo -E SB_JWT_SECRET=testing ./antimony-server -config=./config.yml -dev
    env:
      # Secret of the test OIDC provider that ships with the repo, not a real credential
      SB_OIDC_SECRET: MHRymVDdv9t21ko4FGNGpXTvuLsjRtJd
      SB_DATABASE_PASSWORD: password123
      SB_NATIVE_USERNAME: admin
      SB_NATIVE_PASSWORD: admin
      SB_LOG_LEVEL: debug

  run-c9s:
    dir: './build'
    cmds:
      - task: build
      - SB_JWT_SECRET=testing ./antimony-server -config=./config-c9s.yml
    env:
      # Secret of the test OIDC provider that ships with the repo, not a real credential
      SB_OIDC_SECRET: MHRymVDdv9t21ko4FGNGpXTvuLsjRtJd
      SB_DATABASE_PASSWORD: password123
      SB_NATIVE_USERNAME: admin
      SB_NATIVE_PASSWORD: admin
      SB_LOG_LEVEL: debug

  build-docker:
    cmds:
      - DOCKER_HOST=unix:///var/run/docker.sock docker build -t antimony-backend .

  run-docker:
    dir: './docker'
    cmds:
      - task: build-docker
      - mkdir -p ./db
      - mkdir -p ./storage
      - mkdir -p ./run
      - cp -r ../data/ ./
      - cp ../test/config-docker.test.yml ./config.yml
      - cp ../test/kinds.conf.yml ./
      - DOCKER_HOST=unix:///var/run/docker.sock docker run
        -e SB_LOG_LEVEL=debug
        -e SB_NATIVE_USERNAME=admin
        -e SB_NATIVE_PASSWORD=admin
        -v ./db/:/app/db/
        -v ./storage:/app/storage/
        -v ./run:/app/run/
        -v ./data:/app/data/
        -v ./config.yml:/app/config.yml
        -v ./kinds.conf.yml:/app/kinds.conf.yml
        -v /var/run/docker.sock:/var/run/docker.sock
        -v /var/run/netns:/var/run/netns
        -v /var/lib/docker:/var/lib/docker
        -p 3000:3000
        --privileged
        --network host
        --cgroupns host
        --user root
        --pid host
        antimony-backend -sqlite=true -config=./config.yml

  setup-kind:
    dir: '.'
    cmds:
      - kind delete cluster --name c9s
      - kind create cluster --name c9s
      - >-
        helm upgrade --install --create-namespace --namespace c9s --version 0.9.0
        clabernetes oci://ghcr.io/clabernetes/clabernetes/clabernetes
      - kubectl -n c9s rollout status deployment/clabernetes-manager --timeout=180s
      - kubectl -n c9s rollout status deployment/clabernetes-planner-pool --timeout=180s

  test:
    desc: Fast, cached tests for local iteration
    dir: './src'
    cmds:
      - go test ./...

  test-race:
    desc: Full tests with race detector and shuffled order
    dir: './src'
    env:
      CGO_ENABLED: '1'
    cmds:
      - go test -race -shuffle=on ./...

  test-coverage:
    dir: './src'
    cmds:
      - mkdir -p ../coverage
      - go test -v -coverprofile=../coverage/coverage.out -coverpkg=./... ./...
      - go tool cover -html=../coverage/coverage.out -o ../coverage/coverage.html
      - go tool cover -func=../coverage/coverage.out
      - cmd: |
          echo "Coverage report generated at: coverage/coverage.html"
          echo "Total coverage:" $(go tool cover -func=../coverage/coverage.out | grep total | awk '{print $3}')
        silent: false
