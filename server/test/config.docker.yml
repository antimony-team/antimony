general:
  provider: containerlab
server:
  host: 0.0.0.0
  port: 3000
auth:
  enableNative: true
  enableOpenId: false
  openIdIssuer: ""
  openIdClientId: ""
  openIdRedirectHost: ""
  openIdAdminGroups: []
shell:
  userLimit: 20
  timeout: 1800
database:
  host: 127.0.0.1
  port: 5432
  database: antimony
  user: antimony
  localFile: ./db/antimony.db
capture:
  enabled: yes
  sshHost: 0.0.0.0
  sshPort: 6969
  sshKeyPath: ./key
  excludedInterfaces: [ "lo", "gway-2800", "monit_in", "mgmt0-0" ]
streaming:
  containerLogBacklog: 1000
  clabLogBacklog: 1000
  shellLinesBacklog: 1000
filesystem:
  storage: ./storage/
  run: ./run/
containerlab:
  schemaUrl: https://raw.githubusercontent.com/srl-labs/containerlab/refs/heads/main/schemas/clab.schema.json
  schemaFallback: ./data/clab.schema.json
  deviceConfig: ./data/device-serverConfig.json