# Antimony server configuration.
# All options: https://antimony-team.github.io/antimony/docs/deployment/configuration/

server:
  # Only reachable through Traefik on the same host.
  host: 127.0.0.1
  port: 3000

deployment:
  # containerlab (Docker on this host), clabernetes (Kubernetes) or dummy.
  provider: containerlab

auth:
  # Admin login with SB_NATIVE_USERNAME and SB_NATIVE_PASSWORD from .env.
  enableNative: true
  # Login through an OpenID Connect provider. The client secret goes in SB_OIDC_SECRET.
  enableOpenId: false
  openIdIssuer: ""
  openIdClientId: ""
  openIdRedirectHost: ""
  openIdAdminGroups: []

shell:
  userLimit: 20
  timeout: 1800

database:
  host: 127.0.0.1
  port: 5432
  database: antimony
  user: antimony

ssh:
  # SSH server for node shells and packet capture. It doesn't authenticate
  # clients, so only expose this port to trusted networks.
  sshHost: 0.0.0.0
  sshPort: 6969
  sshKeyPath: ./ssh/host_key

capture:
  excludedInterfaces: ["lo", "gway-*", "monit_in", "mgmt0*", "c9s*"]

fileSystem:
  storage: /srv/antimony/storage/
  run: /srv/antimony/run/
