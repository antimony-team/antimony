name: antimony

# Settings come from .env (see .env.example). Every value has a default,
# so `docker compose up` also works without a .env file for local testing.

services:
  traefik:
    image: traefik:v3.7.4
    restart: unless-stopped
    network_mode: host
    command:
      - --log.level=INFO
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Redirect HTTP to HTTPS
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      # Let's Encrypt. Without a public domain, Traefik serves a self-signed certificate.
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@example.com}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt

  database:
    image: postgres:18
    restart: unless-stopped
    shm_size: 128mb
    network_mode: host
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - SB_DATABASE_PASSWORD=${SB_DATABASE_PASSWORD:-antimony}
      - PGDATA=/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 10
    volumes:
      - ./.db:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d/

  interface:
    # Until release images are published, the images are built from source.
    # Once they are, replace `build:` with:
    #   image: ghcr.io/antimony-team/antimony-interface:<version>
    build:
      context: https://github.com/antimony-team/antimony-interface.git#${ANTIMONY_BRANCH:-development}
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    network_mode: host
    depends_on:
      - server
    labels:
      - traefik.enable=true
      - traefik.http.routers.interface.rule=Host(`${ANTIMONY_HOST:-localhost}`)
      - traefik.http.routers.interface.entrypoints=websecure
      - traefik.http.routers.interface.tls.certresolver=letsencrypt
      - traefik.http.services.interface.loadbalancer.server.port=8100

  server:
    # Once release images are published, replace `build:` with:
    #   image: ghcr.io/antimony-team/antimony-backend:<version>
    build:
      context: https://github.com/antimony-team/antimony-backend.git#${ANTIMONY_BRANCH:-development}
    restart: unless-stopped
    command: -config=./config.yml
    network_mode: host
    privileged: true
    pid: host
    cgroup: host
    user: root
    environment:
      - SB_NATIVE_USERNAME=${SB_NATIVE_USERNAME:-admin}
      - SB_NATIVE_PASSWORD=${SB_NATIVE_PASSWORD:-admin}
      - SB_JWT_SECRET=${SB_JWT_SECRET:-}
      - SB_OIDC_SECRET=${SB_OIDC_SECRET:-}
      - SB_DATABASE_PASSWORD=${SB_DATABASE_PASSWORD:-antimony}
      - SB_LOG_LEVEL=${SB_LOG_LEVEL:-info}
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./kinds.conf.yml:/app/kinds.conf.yml:ro
      - ./mnt/ssh:/app/ssh
      # Topologies and labs. These must have the same path on the host and in the
      # container, because containerlab passes bind file paths to the host's Docker.
      - /srv/antimony:/srv/antimony
      # containerlab
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/run/netns:/var/run/netns
      - /var/lib/docker:/var/lib/docker
      - /etc/hosts:/etc/hosts
      # clabernetes: uncomment to give the server access to your Kubernetes cluster
      # - $HOME/.kube/config:/root/.kube/config:ro
    depends_on:
      database:
        condition: service_healthy
    labels:
      - traefik.enable=true
      # REST API under /api, with the prefix removed
      - traefik.http.routers.server-api.rule=Host(`${ANTIMONY_HOST:-localhost}`) && PathPrefix(`/api`)
      - traefik.http.routers.server-api.entrypoints=websecure
      - traefik.http.routers.server-api.tls.certresolver=letsencrypt
      - traefik.http.routers.server-api.middlewares=api-strip-prefix
      - traefik.http.routers.server-api.service=server
      - traefik.http.middlewares.api-strip-prefix.stripprefix.prefixes=/api
      # Socket.IO
      - traefik.http.routers.server-socket.rule=Host(`${ANTIMONY_HOST:-localhost}`) && PathPrefix(`/socket.io`)
      - traefik.http.routers.server-socket.entrypoints=websecure
      - traefik.http.routers.server-socket.tls.certresolver=letsencrypt
      - traefik.http.routers.server-socket.service=server
      - traefik.http.services.server.loadbalancer.server.port=3000
