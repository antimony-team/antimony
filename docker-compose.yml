name: antimony

services:
  traefik:
    image: traefik:v3.7.4
    restart: unless-stopped
    container_name: traefik
    network_mode: host
    command:
      - --log.level=INFO
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false

      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443

      # HTTP -> HTTPS redirect
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https

      # ACME / Let's Encrypt config
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=antimony@ost.ch
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json

      # Self-signed certificate fallback
      - --entrypoints.websecure.forwardedHeaders.insecure=true
      - --serversTransport.insecureSkipVerify=true

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt

    depends_on:
     - server
     - interface

  database:
    container_name: database
    image: postgres
    restart: always
    shm_size: 128mb
    network_mode: host
    environment:
      - POSTGRES_PASSWORD=postgres
      - SB_DATABASE_PASSWORD=antimony
      - PGDATA=/var/lib/postgresql/data/pgdata
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 2s
      timeout: 3s
      retries: 10
    volumes:
      - ./.db:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d/

  interface:
    container_name: interface
    image: antimony-interface:latest
    # image: ghcr.io/antimony-team/antimony-interface:latest
    depends_on:
      - server
    network_mode: host
    labels:
      - traefik.enable=true
      - traefik.http.routers.interface.rule=PathPrefix(`/`)
      - traefik.http.routers.interface.entrypoints=websecure
      - traefik.http.routers.interface.tls.certresolver=letsencrypt
      - traefik.http.routers.interface.service=interface
      # - traefik.http.routers.interface.tls.domains[0].main=example.com
      - traefik.http.services.interface.loadbalancer.server.port=8100
      - traefik.http.services.interface.loadbalancer.server.scheme=http

  server:
    container_name: server
    image: ghcr.io/antimony-team/antimony-backend:latest
    environment:
      - SB_NATIVE_USERNAME=admin
      - SB_NATIVE_PASSWORD=admin
      - SB_DATABASE_PASSWORD=antimony
    pid: host
    privileged: true
    network_mode: host
    command: -config=./config.yml
    volumes:
      - ./config.yml:/app/config.yml
      - ./kinds.conf.yml:/app/kinds.conf.yml
      - ./mnt/db:/app/db
      - ./mnt/storage:/app/storage/
      - ./mnt/run:/app/run/
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/run/netns:/var/run/netns
      - /var/lib/docker:/var/lib/docker
      - $HOME/.docker/config.json:/root/.docker/config.json
    depends_on:
      database:
        condition: service_healthy
    labels:
      # Server '/socket.io' route
      - traefik.enable=true
      - traefik.http.routers.server-socket.rule=PathPrefix(`/socket.io`)
      - traefik.http.routers.server-socket.entrypoints=websecure
      - traefik.http.routers.server-socket.tls.certresolver=letsencrypt
      - traefik.http.routers.server-socket.service=server-socket
      # - traefik.http.routers.server-socket.tls.domains[0].main=example.com
      - traefik.http.services.server-socket.loadbalancer.server.port=3000
      - traefik.http.services.server-socket.loadbalancer.server.scheme=http

      # Add web socket headers
      - traefik.http.middlewares.socketio-headers.headers.customrequestheaders.Connection=Upgrade
      - traefik.http.middlewares.socketio-headers.headers.customrequestheaders.Upgrade=websocket
      - traefik.http.routers.server-socket.middlewares=socketio-headers

      # Server '/api' route
      - traefik.http.routers.server-api.rule=PathPrefix(`/api`)
      - traefik.http.routers.server-api.entrypoints=websecure
      - traefik.http.routers.server-api.tls.certresolver=letsencrypt
      - traefik.http.routers.server-api.service=server-api
      - traefik.http.routers.server-api.middlewares=api-strip-prefix
      # - traefik.http.routers.server-api.tls.domains[0].main=example.com
      - traefik.http.services.server-api.loadbalancer.server.port=3000
      - traefik.http.services.server-api.loadbalancer.server.scheme=http

      - traefik.http.middlewares.api-strip-prefix.stripprefix.prefixes=/api

  gostwire:
    image: ghcr.io/siemens/ghostwire
    restart: "unless-stopped"
    read_only: true
    entrypoint:
      - "/gostwire"
      - "--http=[::]:5000"
      - "--brand=Edgeshark"
      - "--"
    user: "65534"
    # In order to set only exactly a specific set of capabilities without
    # any additional Docker container default capabilities, we need to drop
    # "all" capabilities. Regardless of the order (there ain't one) of YAML
    # dictionary keys, Docker carries out dropping all capabilities first,
    # and only then adds capabilities. See also:
    # https://stackoverflow.com/a/63219871.
    cap_drop:
      - ALL
    cap_add:
      - CAP_SYS_ADMIN # change namespaces
      - CAP_SYS_CHROOT # change mount namespaces
      - CAP_SYS_PTRACE # access nsfs namespace information
      - CAP_DAC_READ_SEARCH # access/scan /proc/[$PID]/fd itself
      - CAP_DAC_OVERRIDE # access container engine unix domain sockets without being rude, erm, root.
      - CAP_NET_RAW # pingin' 'round
      - CAP_NET_ADMIN # 'nuff tables
    security_opt:
      # The default Docker container AppArmor profile blocks namespace
      # discovery, due to reading from /proc/$PID/ns/* is considered to be
      # ptrace read/ready operations.
      - apparmor:unconfined
    # Essential since we need full PID view.
    pid: "host"
    cgroup: host
    networks:
      99-ghost-in-da-edge:
        priority: 100

  edgeshark:
    image: ghcr.io/siemens/packetflix
    read_only: true
    restart: "unless-stopped"
    entrypoint:
      - "/packetflix"
      - "--port=5001"
      - "--discovery-service=gostwire.ghost-in-da-edge"
      - "--gw-port=5000"
      - "--proxy-discovery"
      - "--debug"

    ports:
      - "127.0.0.1:5001:5001"

    # Run as non-root user (baked into the meta data of the image anyway).
    user: "65534"

    # In order to set only exactly a specific set of capabilities without
    # any additional Docker container default capabilities, we need to drop
    # "all" capabilities. Regardless of the order (there ain't one) of YAML
    # dictionary keys, Docker carries out dropping all capabilities first,
    # and only then adds capabilities. See also:
    # https://stackoverflow.com/a/63219871.
    cap_drop:
      - ALL
    cap_add:
      - CAP_SYS_ADMIN # change namespaces
      - CAP_SYS_CHROOT # change mount namespaces
      - CAP_SYS_PTRACE # access nsfs namespace information
      - CAP_NET_ADMIN # allow dumpcap to control promisc. mode
      - CAP_NET_RAW # capture raw packets, and not that totally burnt stuff
    security_opt:
      # The default Docker container AppArmor profile blocks namespace
      # discovery, due to reading from /proc/$PID/ns/* is considered to be
      # ptrace read/ready operations.
      - apparmor:unconfined

    # Essential since we need full PID view.
    pid: "host"

    networks:
      99-ghost-in-da-edge:
        priority: 100

networks:
  99-ghost-in-da-edge:
    name: ghost-in-da-edge
    internal: false