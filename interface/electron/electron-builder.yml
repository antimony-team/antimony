appId: ch.antimony-team.antimony
productName: Antimony
copyright: MIT

directories:
  output: release
  buildResources: dist

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

linux:
  icon: dist-electron/icons/icon.png
  target:
    - target: AppImage
      arch: [x64, arm64]
  category: Utility
  artifactName: ${productName}-${version}-${arch}.AppImage
