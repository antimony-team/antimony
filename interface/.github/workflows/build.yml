name: Build project and run linters

on:
  push:
    branches: [ development, main ]

  pull_request:
    branches: [ development, main ]

  workflow_call:

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      # Electron and electron-builder download large binaries outside the yarn cache
      - name: Cache Electron binaries
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install

      - name: Run GTS linters
        run: yarn run lint

      - name: Type check
        run: yarn run typecheck

      - name: Install system dependencies
        # electron-builder needs these for AppImage assembly
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: yarn version --new-version "${GITHUB_REF_NAME#v}" --no-git-tag-version

      - name: Build AppImage
        run: yarn run build-electron:linux -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: release/*.AppImage
          retention-days: 30
          if-no-files-found: error
