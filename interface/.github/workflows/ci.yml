name: CI

# Pull requests lint, check and build everything, the image is built but not pushed. Pushes to
# development and main publish the :dev and :main images, a v* tag publishes the versioned image.
# The AppImages (x64 and arm64) are built on every run, since nothing else checks the desktop build.
on:
  push:
    branches: [ development, main ]
    tags: [ 'v*' ]

  pull_request:
    branches: [ development, main ]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      # Only the AppImage needs the Electron binary
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: yarn

      - name: Install dependencies
        run: yarn install

      - name: Run GTS linters
        run: yarn run lint

  typecheck:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: yarn

      - name: Install dependencies
        run: yarn install

      - name: Type check
        run: yarn run typecheck

  test:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: yarn

      - name: Install dependencies
        run: yarn install

      - name: Run unit tests
        run: yarn run test

  appimage:
    needs: [ lint, typecheck, test ]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: yarn

      # Electron and electron-builder download large binaries outside the yarn cache
      - name: Cache Electron binaries
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install

      - name: Install system dependencies
        # electron-builder needs libarchive-tools and rpm for AppImage assembly, rsvg-convert renders the icons
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm librsvg2-bin

      - name: Set up Task
        uses: go-task/setup-task@v2

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: yarn version --new-version "${GITHUB_REF_NAME#v}" --no-git-tag-version

      - name: Build AppImage
        run: task package-electron-linux -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: release/*.AppImage
          retention-days: 30
          if-no-files-found: error

  docker-image:
    needs: [ lint, typecheck, test ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/development' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          file: ./docker/Dockerfile
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
