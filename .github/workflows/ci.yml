name: CI

# Pull requests lint, test and build the parts they change, the images are built but not pushed. Pushes to
# development and main build everything and publish the :dev and :main images, a v* tag publishes the versioned
# images and creates the release once the end-to-end tests pass. Antimony Desktop is built whenever the interface
# is, since nothing else checks the desktop build.
on:
  push:
    branches: [ development, main ]
    tags: [ 'v*' ]

  pull_request:
    branches: [ development, main ]

  workflow_dispatch:

permissions:
  contents: read

env:
  SERVER_IMAGE: ghcr.io/antimony-team/antimony/server
  INTERFACE_IMAGE: ghcr.io/antimony-team/antimony/interface

jobs:
  # Pull requests only run the jobs of the parts they change, everything else runs all of them
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      server: ${{ github.event_name != 'pull_request' || steps.filter.outputs.server == 'true' }}
      interface: ${{ github.event_name != 'pull_request' || steps.filter.outputs.interface == 'true' }}

    steps:
      - name: Find the changed parts
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            server:
              - 'server/**'
              - '.github/workflows/ci.yml'
            interface:
              - 'interface/**'
              - '.github/workflows/ci.yml'
              # The contract test compares the interface types with these
              - 'server/src/docs/**'
              - 'server/src/utils/response.go'

  server-lint:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/src/go.mod
          cache-dependency-path: server/src/go.sum

      - name: Run Linters
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: ./server/src
          args: -c ../.golangci.yml

  server-swagger:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/src/go.mod
          cache-dependency-path: server/src/go.sum

      - name: Install Go Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Check Swagger docs are up to date
        run: task swag-check

  server-build:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/src/go.mod
          cache-dependency-path: server/src/go.sum

      - name: Install Go Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Build
        run: task build

      - name: Check the server starts
        run: test/smoke.sh build

  server-test:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/src/go.mod
          cache-dependency-path: server/src/go.sum

      - name: Install Go Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Run Test
        run: task test-race

  # Each platform is built natively on its own runner, the merge job joins them into one image
  server-image:
    needs: [ server-lint, server-swagger, server-build, server-test ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Name the platform
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.SERVER_IMAGE }}

      # The image is pushed without a tag, the merge job tags it together with the other platform. It carries
      # an SBOM and the provenance of its build, which the merge keeps.
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: server
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          outputs: type=image,name=${{ env.SERVER_IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' }}
          cache-from: type=gha,scope=server-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=server-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        if: github.event_name == 'push'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  server-image-merge:
    needs: server-image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Signing the provenance of the image with the workflow's identity
      id-token: write
      attestations: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.SERVER_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/development' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Create the multi-platform image
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$SERVER_IMAGE@sha256:%s " *)

      - name: Inspect image
        id: image
        run: |
          image="$SERVER_IMAGE:${{ steps.meta.outputs.version }}"
          docker buildx imagetools inspect "$image"
          echo "digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"

      # Proves that the image was built by this workflow, see gh attestation verify
      - name: Attest the image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.SERVER_IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  interface-lint:
    needs: changes
    if: needs.changes.outputs.interface == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interface
    env:
      # Only the AppImage needs the Electron binary
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: yarn
          cache-dependency-path: interface/yarn.lock

      - name: Install dependencies
        run: yarn install

      - name: Run GTS linters
        run: yarn run lint

  interface-typecheck:
    needs: changes
    if: needs.changes.outputs.interface == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interface
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: yarn
          cache-dependency-path: interface/yarn.lock

      - name: Install dependencies
        run: yarn install

      - name: Type check
        run: yarn run typecheck

  interface-test:
    needs: changes
    if: needs.changes.outputs.interface == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interface
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: yarn
          cache-dependency-path: interface/yarn.lock

      - name: Install dependencies
        run: yarn install

      # The coverage summary is printed in the log, the full report is uploaded
      - name: Run unit tests
        run: yarn run test:coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: interface/coverage/
          retention-days: 14

  # The release takes its packages from this job
  interface-desktop:
    needs: [ interface-lint, interface-typecheck, interface-test ]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interface

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: yarn
          cache-dependency-path: interface/yarn.lock

      # Electron and electron-builder download large binaries outside the yarn cache
      - name: Cache Electron binaries
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('interface/yarn.lock') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install

      - name: Install system dependencies
        # electron-builder needs libarchive-tools and rpm for AppImage assembly, rsvg-convert renders the icons
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm librsvg2-bin

      - name: Set up Task
        uses: go-task/setup-task@v2

      # The app starts the server image of its own version
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: yarn version --new-version "${GITHUB_REF_NAME#v}" --no-git-tag-version

      - name: Build the packages
        run: task package-electron-linux -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload the packages
        uses: actions/upload-artifact@v7
        with:
          name: antimony-desktop
          path: |
            interface/release/*.AppImage
            interface/release/*.deb
            interface/release/*.rpm
          retention-days: 30
          if-no-files-found: error

  interface-image:
    needs: [ interface-lint, interface-typecheck, interface-test ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Signing the provenance of the image with the workflow's identity
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.INTERFACE_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/development' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

      # The image carries an SBOM and the provenance of its build
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          file: ./interface/docker/Dockerfile
          context: interface
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/v') && steps.meta.outputs.version || '' }}
            SB_COMMIT=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=interface
          cache-to: type=gha,mode=max,scope=interface

      # Proves that the image was built by this workflow, see gh attestation verify
      - name: Attest the image
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.INTERFACE_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  e2e:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/e2e.yml

  # A v* tag releases once the end-to-end tests pass and both images of its version are published, since the
  # desktop app and the deployment start them
  release:
    needs: [ e2e, server-image-merge, interface-image, interface-desktop ]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      actions: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
